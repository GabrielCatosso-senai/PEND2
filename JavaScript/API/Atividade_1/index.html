<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Câmera e Geolocalização</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Painel de Controle</h1>

        <div id="mensagem" class="status-msg">Aguardando ação...</div>

        
        <section class="card">
            <h2><span class="icon"></span> Localização</h2>
            
            <div class="info-grid">
                <div class="info-item">
                    <span class="label">Latitude:</span>
                    <span id="latitude" class="value">--</span>
                </div>
                <div class="info-item">
                    <span class="label">Longitude:</span>
                    <span id="longitude" class="value">--</span>
                </div>
                <div class="info-item">
                    <span class="label">Precisão:</span>
                    <span id="precisao" class="value">--</span>
                </div>
            </div>

            <div class="status-icon-container">
                <img id="statusImg" src="" alt="Status" class="status-img" style="display: none;">
            </div>

            <button id="btnLocalizacao" class="btn primary">Obter Localização</button>
        </section>

       
        <section class="card">
            <h2><span class="icon"></span> Câmera e Foto</h2>

            <div class="media-container">
               
                <div class="video-wrapper">
                    <video id="camera" autoplay playsinline muted></video>
                </div>

                <div class="preview-wrapper">
                    <img id="fotoCapturada" alt="Foto capturada" style="display: none;" />
                </div>
            </div>

            
            <canvas id="canvasFoto" style="display: none;"></canvas>

            <div class="button-group">
                <button id="btnCamera" class="btn success">Ativar Câmera</button>
                <button id="btnTirarFoto" class="btn warning" disabled>Capturar Foto</button>
                <button id="btnBaixarFoto" class="btn outline" style="display: none;" disabled>Baixar Foto</button>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
